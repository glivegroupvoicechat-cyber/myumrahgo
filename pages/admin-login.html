<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login — MyUmrahGo</title><link rel="stylesheet" href="../styles.css"></head><body style="background:#10120f;color:#fff"><main style="min-height:100vh;display:grid;place-items:center;padding:25px"><form id="f" style="width:100%;max-width:430px;background:#f8f7f2;color:#171815;border-radius:22px;padding:30px"><span class="section-kicker">SECURE OPERATIONS</span><h1 style="font-family:var(--serif);font-size:48px;margin:8px 0 5px">Admin access</h1><p style="color:#777;font-size:12px">Sign in to the MyUmrahGo control panel.</p><label style="display:block;font-size:10px;font-weight:700;margin-top:20px">EMAIL<input id="email" type="email" required style="display:block;width:100%;padding:13px;margin-top:6px;border:1px solid #ddd9cf;border-radius:10px"></label><label style="display:block;font-size:10px;font-weight:700;margin-top:15px">PASSWORD<input id="password" type="password" required style="display:block;width:100%;padding:13px;margin-top:6px;border:1px solid #ddd9cf;border-radius:10px"></label><button class="btn dark" style="width:100%;margin-top:20px">Sign in →</button><div id="msg" style="font-size:11px;color:#8a3333;margin-top:12px"></div></form></main><script>document.getElementById('f').addEventListener('submit',async e=>{e.preventDefault();const msg=document.getElementById('msg');msg.textContent='Signing in…';try{const r=await fetch('../api/login.php',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify({email:document.getElementById('email').value,password:document.getElementById('password').value})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Login failed');if(!['admin','super_admin'].includes(d.user?.role))throw new Error('Admin access required');location.href='admin-inventory.html'}catch(err){msg.textContent=err.message}});</script></body></html>
