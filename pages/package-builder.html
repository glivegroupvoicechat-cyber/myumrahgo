<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Package Builder — MyUmrahGo</title><link rel="stylesheet" href="../styles.css"></head>
<body style="background:#f3f2ed"><main style="max-width:1180px;margin:auto;padding:32px 20px 70px">
<a href="b2b.html" style="font-size:12px">← Partner workspace</a>
<div style="margin:28px 0"><span class="section-kicker">PACKAGE ENGINE</span><h1 style="font-family:var(--serif);font-size:56px;margin:8px 0">Build a quote.</h1><p style="color:#777;max-width:720px">Server-side pricing for flight, visa, Makkah, Madinah, transport, ziyarat and agent margin.</p></div>
<form id="quoteForm"><section class="panel" style="background:#fff;border:1px solid #ddd9cf;border-radius:18px;padding:24px"><div class="formgrid" style="display:grid;grid-template-columns:repeat(2,1fr);gap:14px">
<label>Travellers<input id="travellers" type="number" min="1" value="4" required></label><label>SAR → PKR<input id="fx" type="number" step="0.01" value="77" required></label>
<label>Flight (PKR)<input id="flight" type="number" value="177000"></label><label>Visa + Transport (SAR)<input id="visa" type="number" value="600"></label>
<label>Makkah hotel (SAR)<input id="makkah" type="number" value="0"></label><label>Madinah hotel (SAR)<input id="madinah" type="number" value="0"></label>
<label>Transport / other (PKR)<input id="other" type="number" value="0"></label><label>Agent margin (PKR)<input id="margin" type="number" value="0"></label>
</div><button class="btn dark" style="margin-top:20px">Calculate server price →</button></section></form>
<section class="panel" style="margin-top:16px;background:#171815;color:#fff;border-radius:18px;padding:24px"><span style="color:#c8a35a;font-size:10px;letter-spacing:.15em">QUOTE RESULT</span><div id="result" style="margin-top:15px;color:#bbb">Enter the package values and calculate.</div><div style="margin-top:22px"><button id="booking" class="btn" style="background:#f7f3e9;color:#171815" type="button" disabled>Start Booking →</button></div></section>
</main>
<script>
const $=id=>document.getElementById(id);
function n(id){return Number($(id).value||0)}
$('quoteForm').addEventListener('submit',async e=>{e.preventDefault();const result=$('result');result.textContent='Calculating…';const payload={travellers:n('travellers'),sar_to_pkr:n('fx'),margin_pkr:n('margin'),items:[{name:'Flight',currency:'PKR',unit_price:n('flight'),qty:n('travellers')},{name:'Visa + Transport',currency:'SAR',unit_price:n('visa'),qty:n('travellers')},{name:'Makkah Hotel',currency:'SAR',unit_price:n('makkah'),qty:n('travellers')},{name:'Madinah Hotel',currency:'SAR',unit_price:n('madinah'),qty:n('travellers')},{name:'Transport / Other',currency:'PKR',unit_price:n('other'),qty:1}]};try{const r=await fetch('../api/quote.php',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify(payload)});const d=await r.json();if(!r.ok)throw new Error(d.error||'Quote failed');result.innerHTML=`<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px"><div>PKR subtotal<br><strong style="font-size:22px;color:#fff">PKR ${d.subtotal_pkr.toLocaleString()}</strong></div><div>SAR converted<br><strong style="font-size:22px;color:#fff">PKR ${d.converted_sar_pkr.toLocaleString()}</strong></div><div>Margin<br><strong style="font-size:22px;color:#fff">PKR ${d.margin_pkr.toLocaleString()}</strong></div></div><hr style="border-color:#353731;margin:20px 0"><div style="font-size:12px">FINAL SELLING PRICE</div><strong style="font-size:34px;color:#fff">PKR ${d.total_pkr.toLocaleString()}</strong>`;$('booking').disabled=false;$('booking').dataset.total=d.total_pkr}catch(err){result.textContent=err.message}}
);
$('booking').addEventListener('click',async()=>{const r=await fetch('../api/booking.php',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify({package_id:1,travellers:n('travellers'),room_type:'quad',total_pkr:Number($('booking').dataset.total||0),notes:'Created from Package Builder'})});const d=await r.json();alert(r.ok?`Booking request ${d.booking_no} submitted.`:(d.error||'Booking failed'));});
</script></body></html>
