<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inventory Control — MyUmrahGo</title><link rel="stylesheet" href="../styles.css"></head><body style="background:#f3f2ed"><main style="max-width:1280px;margin:auto;padding:30px 20px 70px"><div style="display:flex;justify-content:space-between;align-items:center;gap:15px"><div><span class="section-kicker">ADMIN OPERATIONS</span><h1 style="font-family:var(--serif);font-size:52px;margin:7px 0">Inventory control</h1></div><a class="pill" href="b2b.html">Partner UI</a></div><div class="panel" style="margin-top:25px;background:#fff;border:1px solid #ddd9cf;border-radius:18px;padding:20px"><div class="toolbar"><select id="type"><option value="hotels">Hotels</option><option value="flights">Flights</option><option value="visa_products">Visa</option><option value="transport_services">Transport</option><option value="ziyarat_services">Ziyarat</option></select><button class="btn dark" id="load">Load published inventory</button></div><div id="state" style="color:#777">Loading inventory…</div><div id="list"></div></div></main><script>
const $=id=>document.getElementById(id);const labels={hotels:'Hotel',flights:'Flight',visa_products:'Visa product',transport_services:'Transport service',ziyarat_services:'Ziyarat / add-on'};
async function load(){const type=$('type').value;$('state').textContent='Loading…';try{const r=await fetch(`../api/inventory.php?type=${encodeURIComponent(type)}&published=1`,{credentials:'include'});const d=await r.json();if(!r.ok)throw new Error(d.error||'Unable to load inventory');const rows=d.items||d.inventory||[];$('state').textContent=`${rows.length} ${labels[type]} records`;$('list').innerHTML=rows.map(x=>`<div style="display:flex;justify-content:space-between;gap:15px;align-items:center;border-top:1px solid #eeeae1;padding:15px 0"><div><b>${x.name||x.hotel_name||x.flight_no||('ID '+x.id)}</b><div style="font-size:11px;color:#777">ID ${x.id} · ${x.status||'published'}</div></div><div style="display:flex;gap:8px"><button class="btn light" onclick="change(${x.id},'unpublish')">Unpublish</button><button class="btn" style="background:#f4dddd;color:#7c2d2d" onclick="change(${x.id},'delete')">Delete</button></div></div>`).join('')||'<p style="color:#777">No published records found.</p>'}catch(e){$('state').textContent=e.message;$('list').innerHTML=''}}
async function change(id,action){if(action==='delete'&&!confirm('Delete this inventory record?'))return;const type=$('type').value;const r=await fetch('../api/inventory-admin.php',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify({type,action,id})});const d=await r.json();if(!r.ok){alert(d.error||'Action failed');return}await load()}
$('load').addEventListener('click',load);$('type').addEventListener('change',load);load();</script></body></html>
