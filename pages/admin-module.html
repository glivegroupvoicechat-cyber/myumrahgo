<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Module — MyUmrahGo</title><link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="../enhanced.css"><style>body{background:#f6f3eb}.wrap{max-width:1450px;margin:auto;padding:35px 5vw}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}.top h1{font-family:var(--serif);font-size:46px;margin:6px 0}.back{background:#fff;border:1px solid var(--line);padding:10px 14px;border-radius:10px;font-size:10px;font-weight:800}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:15px}.toolbar input,.toolbar select{border:1px solid #ddd8cd;border-radius:9px;padding:10px;background:#fff;font-size:10px}.btn{border:0;border-radius:9px;padding:10px 13px;font-size:9px;font-weight:900}.dark{background:#132742;color:#fff}.gold{background:#d2b46d;color:#17253a}.panel{background:#fff;border:1px solid #e2ddd2;border-radius:18px;padding:20px;margin-bottom:15px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:#faf8f2;border:1px solid #e5dfd3;border-radius:14px;padding:16px}.card small{color:#7a828d;font-size:8px;text-transform:uppercase}.card strong{display:block;font-size:22px;margin-top:5px}.table{width:100%;border-collapse:collapse;font-size:10px}.table th,.table td{padding:12px 8px;text-align:left;border-bottom:1px solid #eee9df}.table th{font-size:8px;color:#7a818a;text-transform:uppercase}.badge{padding:5px 8px;border-radius:99px;background:#f1ead8;color:#765c2e;font-size:8px;font-weight:800}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;font-size:8px;font-weight:900;text-transform:uppercase}.field input,.field textarea,.field select{width:100%;margin-top:5px;border:1px solid #ded8cc;border-radius:9px;padding:11px;font:inherit;font-size:10px}.field.full{grid-column:1/-1}.empty{padding:35px;text-align:center;color:#7a818c;font-si </style></head><body><main class="wrap"><header class="top"><div><span class="section-kicker">MYUMRAHGO · ADMIN</span><h1 id="title">Control Module</h1><p id="desc" style="margin:0;color:#78818c;font-size:11px"></p></div><a class="back" href="admin-control.html">← Command Center</a></header><section class="grid" id="cards"></section><section class="panel"><div class="toolbar"><input id="search" placeholder="Search this module"><select><option>All statuses</option><option>Active</option><option>Pending</option><option>Draft</option></select><button class="btn dark" id="primary">+ Add new</button></div><div id="content"></div></section><section class="panel"><h2 style="font-family:var(--serif);font-weight:500;font-size:28px">Module controls</h2><form class="form" id="form"><div class="field"><label>Display / name<input id="name" placeholder="Enter name"></label></div><div class="field"><label>Status<select id="status"><option>Active</option><option>Draft</option><option>Pending</option><option>Suspended</option></select></label></div><div class="field full"><label>Description / notes<textarea id="notes" placeholder="Add operational notes, customer-facing copy or internal instructions"></textarea></label></div><div class="field full"><button class="btn gold" type="submit">Save draft control</button></div></form><div class="notice" style="margin-top:12px">This is the unified UI surface for the module. Production persistence is handled by the secured PHP/MySQL layer; no database credentials are stored in the browser.</div></section></main><script>

const params=new URLSearchParams(location.search),key=params.get('module')||'agencies',c=cfg[key]||cfg.agencies;document.getElementById('title').textContent=c[0];document.getElementById('desc').textContent=c[1];document.title=c[0]+' — MyUmrahGo';document.getElementById('cards').innerHTML=c[2].map((x,i)=>`<div class="card"><small>${x}</small><strong>${['—','—','—','—'][i]}</strong></div>`).join('');document.getElementById('content').innerHTML=`<div class="empty"><b>${c[0]}</b><br><br>Connect the production API to load live records here. This screen is ready for CRUD tables, filters, bulk actions and approval workflows.</div>`;document.getElementById('primary').textContent='+ Add '+(key==='settings'?'setting':key.slice(0,-1));document.getElementById('form').addEventListener('submit',e=>{e.preventDefault();alert('Draft saved for '+c[0]+'. Production save will persist through the Admin API.')});
